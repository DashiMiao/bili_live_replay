name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # gitleaks-action 在 PR 上会扫描 `<head>^..<head>`；
      # 浅克隆缺少父提交会报 unknown revision，所以必须取完整历史。
      # 已知的历史 cookie.txt 泄露在 .gitleaks.toml 的 commits 中精确放行；
      # 清理 git 历史后应删除该放行项。
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: 安装固定版本依赖
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt"

      - name: 运行安全测试
        run: python -m unittest discover -s tests -v
