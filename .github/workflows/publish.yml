name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（例如 1.1.0）"
        required: true
        default: "1.1.0"

jobs:
  # 1) 在各平台用 PyInstaller 编译出原生二进制，作为 artifact 暂存
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 固定在 24.04 上构建：PyInstaller 会把系统库一起打包，
          # 用更新的发行版构建会抬高 glibc 要求，导致 Ubuntu 24.04 / Debian 13 等跑不起来。
          - os: ubuntu-24.04
            pkg: linux-x64
          - os: macos-15-intel
            pkg: darwin-x64
          - os: macos-15
            pkg: darwin-arm64
          - os: windows-latest
            pkg: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # 3.14 起 argparse 的 --help 会自带彩色输出；用 3.12 打包出来的二进制
          # 在终端里没有颜色，和本地运行的观感不一致。
          python-version: "3.14"

      - name: 校验 VERSION 与发布版本一致
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          SRC_VERSION=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' bili_live_replay.py)
          if [ "$SRC_VERSION" != "$VERSION" ]; then
            echo "VERSION 不一致：源码=$SRC_VERSION 发布=$VERSION"
            exit 1
          fi

      - name: 编译二进制
        env:
          # 让 Python（含 PyInstaller 子进程）统一用 UTF-8，避免 Windows 下 cp1252 编码报错
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python build.py

      - name: 暂存二进制（带平台后缀，避免重名）
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp dist/bili_live_replay.exe "bili_live_replay-${{ matrix.pkg }}.exe"
          else
            cp dist/bili_live_replay "bili_live_replay-${{ matrix.pkg }}"
          fi

      - name: 生成 SHA256
        shell: bash
        run: |
          python -c "import hashlib,pathlib; [p.with_name(p.name+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n', encoding='utf-8') for p in pathlib.Path('.').glob('bili_live_replay-*') if p.suffix != '.sha256']"

      - name: 上传 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.pkg }}
          path: bili_live_replay-${{ matrix.pkg }}*
          if-no-files-found: error

  # 2) 汇总各平台二进制，写进 npm 平台包，统一发布
  publish:
    needs: build
    runs-on: ubuntu-latest
    # 1.x 暂时使用 NPM_TOKEN 发布；2.0.0 再切回 Trusted Publishing/OIDC。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 下载所有平台二进制
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: .binaries

      - name: 归位二进制到各平台包
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p npm/linux-x64/bin npm/darwin-x64/bin npm/darwin-arm64/bin npm/win32-x64/bin
          cp .binaries/bili_live_replay-linux-x64    npm/linux-x64/bin/bili_live_replay
          cp .binaries/bili_live_replay-darwin-x64   npm/darwin-x64/bin/bili_live_replay
          cp .binaries/bili_live_replay-darwin-arm64 npm/darwin-arm64/bin/bili_live_replay
          cp .binaries/bili_live_replay-win32-x64.exe npm/win32-x64/bin/bili_live_replay.exe
          chmod +x npm/linux-x64/bin/bili_live_replay \
                   npm/darwin-x64/bin/bili_live_replay \
                   npm/darwin-arm64/bin/bili_live_replay

      - name: 生成 SHA256 校验和
        shell: bash
        run: |
          set -euo pipefail
          sha256sum npm/linux-x64/bin/bili_live_replay \
                    npm/darwin-x64/bin/bili_live_replay \
                    npm/darwin-arm64/bin/bili_live_replay \
                    npm/win32-x64/bin/bili_live_replay.exe > SHA256SUMS
          for pkg in linux-x64 darwin-x64 darwin-arm64; do
            ( cd "npm/$pkg" && sha256sum bin/bili_live_replay > SHA256SUMS )
          done
          ( cd npm/win32-x64 && sha256sum bin/bili_live_replay.exe > SHA256SUMS )
          cp SHA256SUMS npm/bili_live_replay/SHA256SUMS

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: 同步所有 npm 包版本
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "无效的版本号: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          for pkg in linux-x64 darwin-x64 darwin-arm64 win32-x64; do
            npm pkg set --prefix "npm/$pkg" version="$VERSION"
          done
          npm pkg set --prefix npm/bili_live_replay version="$VERSION" \
            "optionalDependencies.@miaodashi/bili_live_replay-linux-x64=$VERSION" \
            "optionalDependencies.@miaodashi/bili_live_replay-darwin-x64=$VERSION" \
            "optionalDependencies.@miaodashi/bili_live_replay-darwin-arm64=$VERSION" \
            "optionalDependencies.@miaodashi/bili_live_replay-win32-x64=$VERSION"
          cp README.md npm/bili_live_replay/README.md

      - name: 检查待发布内容
        shell: bash
        run: |
          set -euo pipefail
          for pkg in linux-x64 darwin-x64 darwin-arm64 win32-x64 bili_live_replay; do
            ( cd "npm/$pkg" && npm pack --dry-run )
          done

      - name: 发布到 npm
        env:
          # 1.x 临时使用 NPM_TOKEN；2.0.0 切回 Trusted Publishing/OIDC 后删除。
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "缺少 NPM_TOKEN secret：请在 GitHub Actions Secrets 中添加 NPM_TOKEN"
            exit 1
          fi
          echo "发布版本: $VERSION"

          publish_if_missing() {
            local dir="$1"
            local name="$2"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION 已存在，跳过"
            else
              ( cd "$dir" && npm publish --access public )
            fi
          }

          for pkg in linux-x64 darwin-x64 darwin-arm64 win32-x64; do
            publish_if_missing "npm/$pkg" "@miaodashi/bili_live_replay-$pkg"
          done
          publish_if_missing "npm/bili_live_replay" "@miaodashi/bili_live_replay"
