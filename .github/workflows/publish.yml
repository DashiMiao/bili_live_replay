name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（例如 1.0.1）"
        required: true
        default: "1.0.1"

jobs:
  # 1) 在各平台用 PyInstaller 编译出原生二进制，作为 artifact 暂存
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pkg: linux-x64
          - os: macos-15-intel
            pkg: darwin-x64
          - os: macos-15
            pkg: darwin-arm64
          - os: windows-latest
            pkg: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 编译二进制
        env:
          # 让 Python（含 PyInstaller 子进程）统一用 UTF-8，避免 Windows 下 cp1252 编码报错
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python build.py

      - name: 暂存二进制（带平台后缀，避免重名）
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp dist/bili_live_replay.exe "bili_live_replay-${{ matrix.pkg }}.exe"
          else
            cp dist/bili_live_replay "bili_live_replay-${{ matrix.pkg }}"
          fi

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.pkg }}
          path: bili_live_replay-${{ matrix.pkg }}*
          if-no-files-found: error

  # 2) 汇总各平台二进制，写进 npm 平台包，统一发布
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: 下载所有平台二进制
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: .binaries

      - name: 归位二进制到各平台包
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p npm/linux-x64/bin npm/darwin-x64/bin npm/darwin-arm64/bin npm/win32-x64/bin
          cp .binaries/bili_live_replay-linux-x64    npm/linux-x64/bin/bili_live_replay
          cp .binaries/bili_live_replay-darwin-x64   npm/darwin-x64/bin/bili_live_replay
          cp .binaries/bili_live_replay-darwin-arm64 npm/darwin-arm64/bin/bili_live_replay
          cp .binaries/bili_live_replay-win32-x64.exe npm/win32-x64/bin/bili_live_replay.exe
          chmod +x npm/linux-x64/bin/bili_live_replay \
                   npm/darwin-x64/bin/bili_live_replay \
                   npm/darwin-arm64/bin/bili_live_replay

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: 同步所有 npm 包版本
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "无效的版本号: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          for pkg in linux-x64 darwin-x64 darwin-arm64 win32-x64; do
            npm pkg set --prefix "npm/$pkg" version="$VERSION"
          done
          npm pkg set --prefix npm/bili_live_replay version="$VERSION" \
            "optionalDependencies.@miaodashi/bili_live_replay-linux-x64=$VERSION" \
            "optionalDependencies.@miaodashi/bili_live_replay-darwin-x64=$VERSION" \
            "optionalDependencies.@miaodashi/bili_live_replay-darwin-arm64=$VERSION" \
            "optionalDependencies.@miaodashi/bili_live_replay-win32-x64=$VERSION"
          cp README.md npm/bili_live_replay/README.md

      - name: 检查待发布内容
        shell: bash
        run: |
          set -euo pipefail
          for pkg in linux-x64 darwin-x64 darwin-arm64 win32-x64 bili_live_replay; do
            ( cd "npm/$pkg" && npm pack --dry-run )
          done

      - name: 发布到 npm
        env:
          # 仅首次创建这 5 个包时需要 NPM_TOKEN；之后由 npm Trusted Publishing/OIDC 认证。
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "发布版本: $VERSION"

          publish_if_missing() {
            local dir="$1"
            local name="$2"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION 已存在，跳过"
            else
              ( cd "$dir" && npm publish --access public )
            fi
          }

          for pkg in linux-x64 darwin-x64 darwin-arm64 win32-x64; do
            publish_if_missing "npm/$pkg" "@miaodashi/bili_live_replay-$pkg"
          done
          publish_if_missing "npm/bili_live_replay" "@miaodashi/bili_live_replay"
