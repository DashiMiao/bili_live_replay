title = "bili_live_replay secret rules"

[extend]
useDefault = true

# 说明：Gitleaks 自带规则已覆盖常见 API key / token；
# 这里额外针对 B 站 Cookie 的关键字段做精确匹配。
[allowlist]
paths = [
  '''requirements-build\.txt''',
]
# 已知的历史 cookie.txt 泄露（提交 a9fd6ad）。这是临时放行，
# 清理 git 历史后必须删除；新提交中的同类泄露仍会被拦截。
commits = [
  "a9fd6ad367a252edac4ad9134c24014588484268",
]

[[rules]]
id = "bilibili-sessdata"
description = "Bilibili SESSDATA session cookie"
regex = '''(?i)\bSESSDATA\s*=\s*([A-Za-z0-9%_,.*-]{20,})'''
secretGroup = 1

[[rules]]
id = "bilibili-bili-jct"
description = "Bilibili bili_jct CSRF token"
regex = '''(?i)\bbili_jct\s*=\s*([0-9a-f]{32})\b'''
secretGroup = 1

[[rules]]
id = "bilibili-dedeuserid-ckmd5"
description = "Bilibili DedeUserID__ckMd5 cookie"
regex = '''(?i)\bDedeUserID__ckMd5\s*=\s*([0-9a-f]{16})\b'''
secretGroup = 1
